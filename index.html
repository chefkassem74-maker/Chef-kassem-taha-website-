<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070707">

<title>Chef Kassem Taha | Executive Chef & Consultant</title>

<style>
:root{
  --black:#070707;
  --black2:#111111;
  --gold:#c99025;
  --gold2:#efbd59;
  --cream:#faf7f0;
  --white:#ffffff;
  --text:#181818;
  --muted:#666;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#fff;
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
  overflow-x:hidden;
}

body.rtl{
  direction:rtl;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}

img{
  display:block;
  max-width:100%;
}

.container{
  width:min(1180px,94%);
  margin:auto;
}

/* =========================
   HEADER
========================= */

.site-header{
  background:#070707;
  border-bottom:2px solid var(--gold);
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}

.navbar{
  min-height:76px;
  display:flex;
  align-items:center;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

.logo{
  width:52px;
  height:52px;
  border:2px solid var(--gold2);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--gold2);
  font:700 24px Georgia,serif;
}

.brand-copy{
  line-height:1.15;
}

.brand-name{
  color:var(--gold2);
  font:700 20px Georgia,serif;
}

.brand-subtitle{
  color:#ddd;
  font-size:9px;
  margin-top:4px;
}

.desktop-nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:15px;
  font-size:11px;
}

body.rtl .desktop-nav{
  margin-left:0;
  margin-right:auto;
}

.desktop-nav a{
  color:#fff;
  padding:9px 0;
}

.desktop-nav a:hover,
.desktop-nav a.active{
  color:var(--gold2);
}

.desktop-nav a.active{
  border-bottom:2px solid var(--gold2);
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.lang-btn,
.menu-btn{
  border:1px solid var(--gold);
  background:#111;
  color:var(--gold2);
  border-radius:7px;
  cursor:pointer;
}

.lang-btn{
  padding:8px 11px;
  font-size:11px;
  font-weight:700;
}

.menu-btn{
  width:42px;
  height:42px;
  display:none;
  font-size:23px;
}

/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
  display:none;
  background:#0a0a0a;
  border-top:1px solid #2c2c2c;
  border-bottom:2px solid var(--gold);
}

.mobile-menu.open{
  display:block;
}

.mobile-menu-inner{
  width:94%;
  margin:auto;
  padding:10px 0 15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.mobile-menu a{
  color:#fff;
  border-bottom:1px solid #252525;
  padding:11px 8px;
  font-size:13px;
}

.mobile-menu a.active{
  color:var(--gold2);
}

/* =========================
   HERO
========================= */

.hero{
  background:
    linear-gradient(
      90deg,
      #ffffff 0%,
      #ffffff 44%,
      #f7f0e2 66%,
      #e6c98d 100%
    );
  overflow:hidden;
}

.hero-grid{
  min-height:500px;
  display:grid;
  grid-template-columns:55% 45%;
  align-items:center;
}

.hero-copy{
  padding:35px 12px 30px 0;
  position:relative;
  z-index:2;
}

body.rtl .hero-copy{
  padding:35px 0 30px 12px;
}

.eyebrow{
  color:#9b680e;
  font-size:10px;
  letter-spacing:2.4px;
  text-transform:uppercase;
  margin-bottom:11px;
}

.hero h1{
  font:700 54px/1.02 Georgia,serif;
  color:#111;
  margin-bottom:10px;
}

.hero-ar{
  color:#a56d10;
  direction:rtl;
  font-size:29px;
  font-weight:700;
  margin-bottom:14px;
  text-align:left;
}

body.rtl .hero-ar{
  text-align:right;
}

.intro{
  max-width:610px;
  font:16px/1.5 Georgia,serif;
}

/* HERO FEATURES */

.hero-features{
  margin-top:23px;
  max-width:670px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.feature{
  text-align:center;
  padding:5px 7px;
  border-right:1px solid #ddd;
}

body.rtl .feature{
  border-right:0;
  border-left:1px solid #ddd;
}

.feature:last-child{
  border-right:0;
  border-left:0;
}

.feature-icon{
  color:var(--gold);
  font-size:25px;
  margin-bottom:4px;
}

.feature strong{
  display:block;
  font:700 13px Georgia,serif;
}

.feature small{
  display:block;
  font-size:9px;
  margin-top:3px;
}

/* BUTTONS */

.hero-buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.btn{
  min-height:43px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:11px 18px;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
}

.btn-gold{
  color:#111;
  background:linear-gradient(90deg,#d59422,#ffd16a);
}

.btn-dark{
  background:#080808;
  color:#fff;
  border:1px solid var(--gold);
}

/* CHEF PHOTO */

.hero-photo{
  height:500px;
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.hero-photo::before{
  content:"";
  position:absolute;
  inset:35px 0 0;
  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(218,160,53,.27),
      transparent 60%
    );
}

.hero-photo img{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
}

/* =========================
   CUISINES
========================= */

.cuisines{
  padding:15px 0 22px;
  background:#fff;
}

.food-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

.food-card{
  background:#fff;
  border:1px solid #e1ddd3;
  border-radius:6px;
  overflow:hidden;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.food-photo{
  height:110px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:43px;
  background:
    linear-gradient(
      135deg,
      #311903,
      #c78827
    );
}

.food-card h3{
  font:700 13px Georgia,serif;
  padding:8px 5px 3px;
}

.food-ar{
  direction:rtl;
  color:#a66d10;
  font-size:12px;
  font-weight:700;
}

.food-card p{
  font:10px/1.4 Georgia,serif;
  padding:5px 7px 11px;
}

/* =========================
   STORY
========================= */

.story{
  background:#070707;
  color:#fff;
  border-top:2px solid var(--gold);
  border-bottom:2px solid var(--gold);
}

.story-grid{
  min-height:190px;
  display:grid;
  grid-template-columns:1fr .75fr 1fr;
  align-items:center;
  gap:18px;
}

.story-left h2{
  color:var(--gold2);
  font:700 26px/1.15 Georgia,serif;
}

.story-ar{
  direction:rtl;
  color:var(--gold2);
  font-size:19px;
  font-weight:700;
  margin:7px 0 16px;
  text-align:left;
}

body.rtl .story-ar{
  text-align:right;
}

.story-photo{
  height:190px;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:flex-end;
}

.story-photo img{
  height:190px;
  object-fit:contain;
}

.story-quote{
  font:14px/1.5 Georgia,serif;
}

.signature{
  margin-top:9px;
  color:var(--gold2);
  font:italic 22px Georgia,serif;
}

/* =========================
   STATS
========================= */

.statistics{
  background:#fff;
  padding:21px 0;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.stat{
  text-align:center;
  padding:4px 13px;
  border-right:1px solid #ddd;
}

body.rtl .stat{
  border-right:0;
  border-left:1px solid #ddd;
}

.stat:last-child{
  border:0;
}

.stat-icon{
  color:var(--gold);
  font-size:28px;
}

.stat strong{
  display:block;
  margin:3px 0;
  font:700 23px Georgia,serif;
}

.stat-label{
  font-size:11px;
}

.stat-ar{
  direction:rtl;
  color:#765319;
  margin-top:3px;
  font-size:10px;
}

/* =========================
   FOOTER
========================= */

footer{
  background:#050505;
  color:#fff;
  border-top:3px solid var(--gold);
  padding:23px 0 12px;
}

.footer-grid{
  display:grid;
  grid-template-columns:1.2fr .9fr 1.2fr;
  gap:28px;
}

.footer-brand{
  color:var(--gold2);
  font:700 20px Georgia,serif;
}

.footer-text{
  margin-top:8px;
  font-size:11px;
  line-height:1.6;
}

footer h3{
  color:var(--gold2);
  font-size:13px;
  margin-bottom:8px;
}

.quick-links{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  font-size:10px;
}

.contact-line{
  font-size:10px;
  margin-bottom:7px;
}

.copyright{
  margin-top:17px;
  padding-top:10px;
  border-top:1px solid #333;
  color:#aaa;
  font-size:9px;
}

/* ============================================
   MOBILE
============================================ */

@media(max-width:800px){

  .container{
    width:94%;
  }

  /* HEADER */

  .navbar{
    min-height:61px;
  }

  .logo{
    width:41px;
    height:41px;
    font-size:19px;
  }

  .brand-name{
    font-size:15px;
  }

  .brand-subtitle{
    display:none;
  }

  .desktop-nav{
    display:none;
  }

  .lang-btn{
    padding:7px 9px;
    font-size:10px;
  }

  .menu-btn{
    display:block;
  }

  /* HERO */

  .hero{
    background:
      linear-gradient(
        90deg,
        #fff 0%,
        #fff 47%,
        #f5ead4 100%
      );
  }

  .hero-grid{
    min-height:0;
    display:grid;
    grid-template-columns:56% 44%;
    align-items:stretch;
  }

  .hero-copy{
    padding:23px 0 14px;
  }

  body.rtl .hero-copy{
    padding:23px 0 14px;
  }

  .eyebrow{
    font-size:6px;
    letter-spacing:1px;
    margin-bottom:6px;
  }

  .hero h1{
    font-size:27px;
    line-height:1.03;
    margin-bottom:6px;
  }

  .hero-ar{
    font-size:16px;
    line-height:1.2;
    margin-bottom:7px;
  }

  .
