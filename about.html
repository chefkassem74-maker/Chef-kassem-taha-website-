<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="About Chef Kassem Taha - Global Culinary and Hospitality Expert with more than 33 years of professional experience.">

  <meta name="author" content="Chef Kassem Taha">

  <title>About | Chef Kassem Taha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>

    /* =====================================================
       ABOUT PAGE
    ===================================================== */

    .about-page {
      background: #fffaf2;
    }

    .about-page main {
      overflow: hidden;
    }

    .about-container {
      width: min(92%, 1240px);
      margin-inline: auto;
    }

    /* =====================================================
       HERO
    ===================================================== */

    .about-hero {
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 70% 35%,
          rgba(213, 164, 60, .13),
          transparent 32%
        ),
        linear-gradient(
          115deg,
          #050403,
          #151008
        );

      color: #ffffff;
      border-bottom: 2px solid #9d6d18;
    }

    .about-hero-grid {
      min-height: 610px;
      display: grid;
      grid-template-columns: minmax(340px, .9fr) minmax(0, 1.1fr);
      align-items: center;
      gap: 65px;
      padding-top: 55px;
    }

    .about-hero-image {
      position: relative;
      align-self: end;
      overflow: hidden;
      max-width: 540px;

      border: 1px solid rgba(213, 164, 60, .55);
      border-radius: 7px 7px 0 0;

      background: #080604;
      box-shadow: 0 20px 55px rgba(0, 0, 0, .32);
    }

    .about-hero-image img {
      width: 100%;
      height: 560px;
      object-fit: cover;
      object-position: center top;
    }

    .about-hero-content {
      padding: 70px 0;
    }

    .about-label {
      margin: 0 0 18px;
      color: #e0ad43;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .about-hero-content h1 {
      margin: 0;
      color: #ffffff;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(58px, 7vw, 90px);
      line-height: .9;
      font-weight: 600;
    }

    .about-role {
      max-width: 690px;
      margin-top: 30px;
      color: #e1ad43;
      font-size: clamp(24px, 3vw, 38px);
      font-weight: 800;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .about-divider {
      width: 120px;
      height: 3px;
      margin: 35px 0;
      background: #d5a43c;
    }

    .about-experience {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .about-experience strong {
      color: #d5a43c;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 92px;
      line-height: .85;
      font-weight: 600;
    }

    .about-experience div {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .about-experience span {
      max-width: 430px;
      color: #ffffff;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 28px;
      line-height: 1.15;
    }

    .about-experience small {
      max-width: 500px;
      color: #d5a43c;
      font-size: 14px;
      line-height: 1.6;
    }

    /* =====================================================
       STORY
    ===================================================== */

    .about-story {
      padding: 90px 0;
      background: #fffaf2;
    }

    .about-story-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, .82fr);
      align-items: center;
      gap: 70px;
    }

    .about-section-title {
      margin: 0;
      color: #18110a;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(48px, 5vw, 68px);
      line-height: .98;
      font-weight: 600;
    }

    .about-section-subtitle {
      margin: 22px 0 0;
      color: #ad7a21;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.55;
    }

    .about-story-text {
      margin-top: 34px;
    }

    .about-story-text p {
      margin: 0 0 21px;
      color: #655d53;
      font-size: 17px;
      line-height: 1.85;
    }

    .about-story-image {
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(34, 22, 9, .15);
    }

    .about-story-image img {
      width: 100%;
      height: 560px;
      object-fit: cover;
      object-position: center;
    }

    /* =====================================================
       JOURNEY
    ===================================================== */

    .journey-section {
      padding: 90px 0;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(213, 164, 60, .08),
          transparent 28%
        ),
        #060504;

      color: #ffffff;
      border-top: 1px solid #9d6d18;
      border-bottom: 1px solid #9d6d18;
    }

    .journey-section .about-section-title {
      color: #ffffff;
    }

    .journey-section .about-section-subtitle {
      color: #d5a43c;
    }

    .journey-intro {
      max-width: 850px;
      margin: 35px 0 55px;
      color: #d6cec3;
      font-size: 18px;
      line-height: 1.85;
    }

    .journey-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
    }

    .journey-card {
      min-width: 0;
      padding: 32px 18px;
      text-align: center;
      border: 1px solid rgba(213, 164, 60, .30);
      border-radius: 7px;

      background:
        linear-gradient(
          180deg,
          rgba(213, 164, 60, .05),
          rgba(255, 255, 255, .01)
        );
    }

    .journey-code {
      width: 112px;
      height: 112px;
      margin: 0 auto 25px;
      display: grid;
      place-items: center;

      border: 2px solid #c49338;
      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(213, 164, 60, .17),
          rgba(213, 164, 60, .03) 62%,
          transparent 63%
        );

      color: #d5a43c;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 38px;
      font-weight: 600;
    }

    .journey-card h3 {
      margin: 0;
      color: #dda942;
      font-size: 17px;
      line-height: 1.25;
    }

    .journey-card p {
      margin: 15px 0 0;
      color: #c9c1b7;
      font-size: 13px;
      line-height: 1.65;
    }

    /* =====================================================
       EXPERTISE
    ===================================================== */

    .expertise-section {
      padding: 90px 0;
      background: #f8f1e5;
    }

    .expertise-intro {
      max-width: 850px;
    }

    .expertise-description {
      margin: 35px 0 45px;
      color: #655d53;
      font-size: 18px;
      line-height: 1.85;
    }

    .expertise-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .expertise-card {
      min-height: 245px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px 20px;
      text-align: center;

      border: 1px solid rgba(157, 109, 24, .27);
      border-radius: 7px;
      background: rgba(255, 255, 255, .48);
    }

    .expertise-icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin-bottom: 23px;

      border: 1px solid #b4822d;
      border-radius: 50%;
      color: #a87420;
      font-size: 25px;
    }

    .expertise-card h3 {
      margin: 0;
      color: #18130d;
      font-size: 18px;
      line-height: 1.3;
    }

    .expertise-card p {
      margin: 13px 0 0;
      color: #70675c;
      font-size: 14px;
      line-height: 1.5;
    }

    /* =====================================================
       PHILOSOPHY
    ===================================================== */

    .philosophy-section {
      padding: 90px 0;

      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(213, 164, 60, .09),
          transparent 30%
        ),
        #060504;

      color: #ffffff;
    }

    .philosophy-heading {
      max-width: 850px;
      margin-inline: auto;
      text-align: center;
    }

    .philosophy-heading h2 {
      margin: 0;
      color: #d8a542;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(52px, 6vw, 78px);
      line-height: 1;
      font-weight: 600;
    }

    .philosophy-heading > p {
      margin: 22px 0 0;
      color: #d8a542;
      font-size: 20px;
      font-weight: 800;
    }

    .philosophy-quote {
      max-width: 900px;
      margin: 45px auto 0;
      text-align: center;
    }

    .philosophy-quote blockquote {
      margin: 0;
      color: #ffffff;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(36px, 4vw, 54px);
      line-height: 1.18;
      font-weight: 500;
    }

    .philosophy-quote p {
      max-width: 790px;
      margin: 30px auto 0;
      color: #d5a43c;
      font-size: 17px;
      line-height: 1.75;
    }

    .philosophy-values {
      max-width: 1000px;
      margin: 55px auto 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 35px;
    }

    .philosophy-value {
      min-height: 120px;
      display: grid;
      grid-template-columns: 72px 1fr;
      align-items: center;
      gap: 20px;
      padding: 20px 0;
      border-bottom: 1px solid rgba(213, 164, 60, .20);
    }

    .value-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;

      border: 1px solid #a97826;
      border-radius: 50%;
      color: #d5a43c;
      font-size: 22px;
    }

    .philosophy-value h3 {
      margin: 0;
      color: #ffffff;
      font-size: 18px;
      line-height: 1.25;
    }

    .philosophy-value p {
      margin: 7px 0 0;
      color: #bdb5aa;
      font-size: 14px;
      line-height: 1.45;
    }

    /* =====================================================
       CTA
    ===================================================== */

    .about-cta {
      padding: 85px 0;
      background: #f8f1e5;
      text-align: center;
    }

    .about-cta-inner {
      max-width: 920px;
      margin-inline: auto;
    }

    .about-cta h2 {
      margin: 0;
      color: #18110a;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(48px, 6vw, 70px);
      line-height: 1;
      font-weight: 600;
    }

    .about-cta p {
      max-width: 780px;
      margin: 30px auto 38px;
      color: #655d53;
      font-size: 17px;
      line-height: 1.8;
    }

    .about-cta .btn {
      min-width: 270px;
    }

    /* =====================================================
       RTL
    ===================================================== */

    html[dir="rtl"] .about-hero-content,
    html[dir="rtl"] .about-story,
    html[dir="rtl"] .journey-section,
    html[dir="rtl"] .expertise-section {
      text-align: right;
    }

    html[dir="rtl"] .about-hero-content h1,
    html[dir="rtl"] .about-section-title,
    html[dir="rtl"] .philosophy-heading h2,
    html[dir="rtl"] .about-cta h2 {
      font-family: "Cairo", Arial, sans-serif;
    }

    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 1000px) {

      .about-hero-grid {
        gap: 35px;
      }

      .journey-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .expertise-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 820px) {

      .about-container {
        width: 92%;
      }

      .about-hero-grid {
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 0;
        padding-top: 0;
      }

      .about-hero-image {
        width: 100%;
        max-width: 660px;
        margin-inline: auto;
        align-self: auto;
        border-radius: 0 0 7px 7px;
      }

      .about-hero-image img {
        height: auto;
        max-height: 500px;
        object-fit: cover;
        object-position: center top;
      }

      .about-hero-content {
        padding: 45px 0 55px;
        text-align: center;
      }

      html[dir="rtl"] .about-hero-content {
        text-align: center;
      }

      .about-label {
        margin-bottom: 15px;
        font-size: 11px;
        letter-spacing: 3px;
      }

      .about-hero-content h1 {
        font-size: clamp(52px, 14vw, 72px);
        line-height: .92;
      }

      html[dir="rtl"] .about-hero-content h1 {
        font-size: 43px;
        line-height: 1.25;
      }

      .about-role {
        margin: 25px auto 0;
        max-width: 570px;
        font-size: 23px;
        line-height: 1.45;
      }

      .about-divider {
        width: 100px;
        margin: 27px auto;
      }

      .about-experience {
        justify-content: center;
        gap: 22px;
      }

      .about-experience strong {
        font-size: 74px;
      }

      .about-experience div {
        max-width: 310px;
        text-align: left;
      }

      html[dir="rtl"] .about-experience div {
        text-align: right;
      }

      .about-experience span {
        font-size: 22px;
      }

      .about-experience small {
        font-size: 12px;
      }

      .about-story {
        padding: 60px 0;
      }

      .about-story-grid {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .about-section-title {
        font-size: 46px;
        line-height: 1;
      }

      html[dir="rtl"] .about-section-title {
        font-size: 36px;
        line-height: 1.35;
      }

      .about-section-subtitle {
        margin-top: 18px;
        font-size: 16px;
      }

      .about-story-text {
        margin-top: 28px;
      }

      .about-story-text p {
        font-size: 15px;
        line-height: 1.8;
      }

      .about-story-image {
        order: 2;
      }

      .about-story-image img {
        height: auto;
        max-height: 520px;
      }

      .journey-section {
        padding: 60px 0;
      }

      .journey-intro {
        margin: 27px 0 38px;
        font-size: 15px;
        line-height: 1.75;
      }

      .journey-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .journey-card {
        padding: 27px 13px;
      }

      .journey-code {
        width: 88px;
        height: 88px;
        margin-bottom: 18px;
        font-size: 31px;
      }

      .journey-card h3 {
        font-size: 15px;
      }

      .journey-card p {
        font-size: 12px;
      }

      .expertise-section {
        padding: 60px 0;
      }

      .expertise-description {
        margin: 27px 0 35px;
        font-size: 15px;
        line-height: 1.75;
      }

      .expertise-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .expertise-card {
        min-height: 205px;
        padding: 24px 14px;
      }

      .expertise-icon {
        width: 58px;
        height: 58px;
        margin-bottom: 17px;
        font-size: 20px;
      }

      .expertise-card h3 {
        font-size: 15px;
      }

      .expertise-card p {
        font-size: 12px;
      }

      .philosophy-section {
        padding: 60px 0;
      }

      .philosophy-heading h2 {
        font-size: 50px;
      }

      html[dir="rtl"] .philosophy-heading h2 {
        font-size: 39px;
      }

      .philosophy-heading > p {
        margin-top: 17px;
        font-size: 17px;
      }

      .philosophy-quote {
        margin-top: 34px;
      }

      .philosophy-quote blockquote {
        font-size: 34px;
        line-height: 1.22;
      }

      html[dir="rtl"] .philosophy-quote blockquote {
        font-family: "Cairo", Arial, sans-serif;
        font-size: 26px;
        line-height: 1.7;
      }

      .philosophy-quote p {
        margin-top: 23px;
        font-size: 15px;
        line-height: 1.7;
      }

      .philosophy-values {
        margin-top: 40px;
        grid-template-columns: 1fr;
        gap: 0;
      }

      .philosophy-value {
        min-height: 100px;
        grid-template-columns: 60px 1fr;
        gap: 16px;
        padding: 16px 0;
      }

      .value-icon {
        width: 54px;
        height: 54px;
        font-size: 18px;
      }

      .philosophy-value h3 {
        font-size: 16px;
      }

      .philosophy-value p {
        font-size: 13px;
      }

      .about-cta {
        padding: 60px 0;
      }

      .about-cta h2 {
        font-size: 49px;
        line-height: 1.05;
      }

      html[dir="rtl"] .about-cta h2 {
        font-size: 37px;
        line-height: 1.4;
      }

      .about-cta p {
        margin: 25px auto 32px;
        font-size: 15px;
        line-height: 1.75;
      }

      .about-cta .btn {
        width: 100%;
        min-width: 0;
      }

      .main-nav.open {
        max-height: 700px;
        overflow-y: auto;
      }
    }

    /* =====================================================
       SMALL MOBILE
    ===================================================== */

    @media (max-width: 520px) {

      .about-hero-image img {
        max-height: 430px;
      }

      .about-hero-content {
        padding: 38px 0 45px;
      }

      .about-hero-content h1 {
        font-size: 54px;
      }

      .about-role {
        font-size: 20px;
      }

      .about-experience {
        align-items: center;
        gap: 15px;
      }

      .about-experience strong {
        font-size: 66px;
      }

      .about-experience span {
        font-size: 18px;
      }

      .about-experience small {
        font-size: 11px;
      }

      .about-story,
      .journey-section,
      .expertise-section,
      .philosophy-section,
      .about-cta {
        padding-top: 52px;
        padding-bottom: 52px;
      }

      .about-section-title {
        font-size: 42px;
      }

      .journey-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .journey-card {
        min-height: 230px;
        padding: 22px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .journey-card:last-child {
        grid-column: 1 / -1;
        width: calc(50% - 6px);
        justify-self: center;
      }

      .journey-code {
        width: 68px;
        height: 68px;
        margin: 0 auto 14px;
        font-size: 24px;
        border-width: 1px;
      }

      .journey-card h3 {
        font-size: 13px;
        line-height: 1.3;
      }

      .journey-card p {
        margin-top: 10px;
        font-size: 11px;
        line-height: 1.5;
      }

      .expertise-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .expertise-card {
        min-height: 190px;
        padding: 20px 10px;
      }

      .expertise-icon {
        width: 52px;
        height: 52px;
        margin-bottom: 15px;
        font-size: 18px;
      }

      .expert
